<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bangla-Cal · Research workspace</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#content">Skip to workspace</a>
  <header class="app-header">
    <a class="brand" href="/">Bangla-Cal</a>
    <nav aria-label="Workspace">
      <button data-view="results" class="active">Results</button>
      <button data-view="dataset">Questions</button>
      <button data-view="runs">Evaluations</button>
      <button data-view="grading">Human grading</button>
    </nav>
    <a class="repo-link" href="https://github.com/Niloy-Bhuiyan/bangla-cal" target="_blank" rel="noreferrer">GitHub ↗</a>
  </header>
  <div class="workspace">
    <main id="content" tabindex="-1"><div class="empty">Loading…</div></main>
    <section id="job" aria-label="Task progress" hidden></section>
    <footer><span>Local workspace · Keys stay on this computer</span><span>Research preview</span></footer>
  </div>
  <dialog id="task-dialog" aria-labelledby="dialog-title"></dialog>
  <div id="notice" role="status" aria-live="polite" hidden></div>
</body>
</html>
